<!doctype html>
<title> Log In - Flaskr</title>
<link rel="stylesheet" href="/static/style.css">
<nav>
  <h1>Flaskr</h1>
  <ul>
      <li><a href="/auth/register">Register</a> <!--se registra, porque no esta logeado-->
      <li><a href="/auth/login ">Log In</a>
  </ul>
</nav>
<section class="content">
  <header>
    <h1>Log In</h1>
  </header>

    <div class="flash">usuario incorrecto</div>
  
  <form method="post">
    <label for="username">Username</label>
    <input name="username" id="username" required>
    <label for="password">Password</label>
    <input type="password" name="password" id="password" required>
    <input type="submit" value="Log In">
  </form>
</section>
<!--una copia de la base de datos pero fuimos completando/reemplanzo los huecos, 
sacando las llaves y con la informacion que estaba en el archivo login.html-->


<!--blog/update.html/  ejercicio 2-->
<!doctype html>
<title> Edit "Noticia" - Flaskr</title>
<link rel="stylesheet" href="/static/style.css">
<nav>
  <h1>Flaskr</h1>
  <ul>
      <li><span>Juan</span>
      <li><a href="/auth/logout ">Log Out</a>
  </ul>
</nav>
<section class="content">
  <header>
    <h1>Edit "Noticia"</h1>
  </header>
   
  <form method="post">
    <label for="title">Title</label>
    <input name="title" id="title"
      value="{{ request.form['title'] or post['noticia'] }}" required>
    <label for="body">Body</label>
    <textarea name="body" id="body">{{ request.form['body'] or post['body'] }}</textarea>
    <input type="submit" value="Save">
  </form>
  <hr>
  <form action="{{ url_for('blog.delete', id=post['id']) }}" method="post">
    <input class="danger" type="submit" value="Delete" onclick="return confirm('Are you sure?');">
  </form>
</section>
